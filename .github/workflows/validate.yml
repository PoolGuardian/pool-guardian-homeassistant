name: Validate

# Weekly schedule is not padding. hassfest and the HACS action validate against
# whatever Home Assistant currently requires, so this repo can start failing
# without a single commit — a new required manifest key, a renamed constant, a
# deprecated import. Finding that on a Monday beats finding it in a user's log.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade ruff
      - run: ruff check custom_components
      - run: ruff format --check custom_components
